name: VWorld private data proxy
on:
  push:
    branches: [main]
    paths: ['cloudflare/vworld/**', '.github/workflows/vworld-proxy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vworld-proxy
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node cloudflare/vworld/data-test.mjs
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare server-only secret
        env:
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
        run: |
          python - <<'PY'
          import os,json,pathlib
          required=['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','VWORLD_API_KEY']
          for name in required:
              if not os.environ.get(name):raise SystemExit('Missing repository secret: '+name)
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'vworld-worker-secrets.json'
          path.write_text(json.dumps({'VWORLD_API_KEY':os.environ['VWORLD_API_KEY']}))
          path.chmod(0o600)
          PY
      - name: Initialize workers.dev address
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error,pathlib
          api='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CLOUDFLARE_ACCOUNT_ID']+'/workers/subdomain'
          headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'],'Content-Type':'application/json'}
          def call(method,data=None):
              req=urllib.request.Request(api,headers=headers,method=method,data=None if data is None else json.dumps(data).encode())
              try:
                  with urllib.request.urlopen(req,timeout=30) as response:return json.load(response)
              except urllib.error.HTTPError as e:
                  try:return json.load(e)
                  except:raise SystemExit('Cloudflare address setup HTTP '+str(e.code))
          current=call('GET')
          domain=current.get('result',{}).get('subdomain') if isinstance(current.get('result'),dict) else None
          if not domain:
              for candidate in ['conta-studio-yohyeseong','conta-studio-yohyeseong-2','conta-studio-yohyeseong-3']:
                  response=call('PUT',{'subdomain':candidate})
                  if response.get('success'):
                      domain=response.get('result',{}).get('subdomain',candidate);break
              if not domain:raise SystemExit('Cannot initialize workers.dev address. Complete Cloudflare Workers onboarding.')
          url='https://conta-vworld-proxy.'+domain+'.workers.dev'
          pathlib.Path('proxy-url.txt').write_text(url)
          print('Map proxy address: '+url)
          PY
      - name: Deploy private data proxy
        run: npx --yes wrangler@4 deploy --config cloudflare/vworld/wrangler.jsonc --secrets-file "$RUNNER_TEMP/vworld-worker-secrets.json"
      - name: Verify private vector data
        run: |
          python - <<'PY'
          import pathlib,urllib.request,urllib.error,time,json
          base=pathlib.Path('proxy-url.txt').read_text().strip()
          headers={'Origin':'https://yohyeseong.github.io','User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/145.0.0.0 Safari/537.36'}
          report={'proxy':base,'mode':'data','layers':{}}
          for attempt in range(3):
              try:
                  with urllib.request.urlopen(urllib.request.Request(base+'/health',headers=headers),timeout=20) as r:
                      health=json.load(r)
                      if not health.get('ready') or health.get('mode')!='data':raise RuntimeError('Data service not ready')
                  print('PRIVATE_DATA_PROXY_HEALTH_READY')
                  for kind in ['buildings','roads']:
                      path='/data/'+kind+'?bbox=126.978,37.565,126.980,37.567'
                      with urllib.request.urlopen(urllib.request.Request(base+path,headers=headers),timeout=25) as r:data=json.load(r)
                      if data.get('type')!='FeatureCollection':raise RuntimeError('Invalid vector response')
                      features=data['features']
                      report['layers'][kind]={'count':len(features),'total':data.get('total'),'geometryTypes':sorted(set(f['geometry']['type'] for f in features)),'fields':sorted(set(k for f in features for k in (f.get('properties') or {})))}
                  pathlib.Path('vworld-data-validation.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
                  print('VWORLD_DATA_VERIFIED '+json.dumps(report,ensure_ascii=False))
                  break
              except urllib.error.HTTPError as e:
                  try:reason=json.load(e).get('error','unknown')
                  except:reason='Non-JSON error'
                  print('Data HTTP diagnostic:',e.code,reason)
                  if attempt==2:raise SystemExit('VWorld data verification failed')
                  time.sleep(5)
              except Exception as e:
                  if attempt==2:raise SystemExit('Data verification failed: '+str(e))
                  time.sleep(5)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vworld-data-validation
          path: |
            proxy-url.txt
            vworld-data-validation.json
      - name: Remove temporary secret
        if: always()
        run: rm -f -- "$RUNNER_TEMP/vworld-worker-secrets.json"
