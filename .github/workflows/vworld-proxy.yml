name: VWorld private data proxy
on:
  push:
    branches: [main]
    paths: ['cloudflare/vworld/**', '.github/workflows/vworld-proxy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vworld-proxy
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node cloudflare/vworld/data-test.mjs
      - run: node --test cloudflare/vworld/vector-test.mjs
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare server-only secret
        env:
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
        run: |
          python - <<'PY'
          import os,json,pathlib
          required=['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','VWORLD_API_KEY']
          for name in required:
              if not os.environ.get(name):raise SystemExit('Missing repository secret: '+name)
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'vworld-worker-secrets.json'
          path.write_text(json.dumps({'VWORLD_API_KEY':os.environ['VWORLD_API_KEY']}))
          path.chmod(0o600)
          PY
      - name: Initialize workers.dev address
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error,pathlib
          api='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CLOUDFLARE_ACCOUNT_ID']+'/workers/subdomain'
          headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'],'Content-Type':'application/json'}
          def call(method,data=None):
              req=urllib.request.Request(api,headers=headers,method=method,data=None if data is None else json.dumps(data).encode())
              try:
                  with urllib.request.urlopen(req,timeout=30) as response:return json.load(response)
              except urllib.error.HTTPError as e:
                  try:return json.load(e)
                  except:raise SystemExit('Cloudflare address setup HTTP '+str(e.code))
          current=call('GET')
          domain=current.get('result',{}).get('subdomain') if isinstance(current.get('result'),dict) else None
          if not domain:
              for candidate in ['conta-studio-yohyeseong','conta-studio-yohyeseong-2','conta-studio-yohyeseong-3']:
                  response=call('PUT',{'subdomain':candidate})
                  if response.get('success'):
                      domain=response.get('result',{}).get('subdomain',candidate);break
              if not domain:raise SystemExit('Cannot initialize workers.dev address. Complete Cloudflare Workers onboarding.')
          url='https://conta-vworld-proxy.'+domain+'.workers.dev'
          pathlib.Path('proxy-url.txt').write_text(url)
          print('Map proxy address: '+url)
          PY
      - name: Deploy private data proxy
        run: npx --yes wrangler@4 deploy --config cloudflare/vworld/wrangler.jsonc --secrets-file "$RUNNER_TEMP/vworld-worker-secrets.json"
      - name: Compare direct VWorld requests from the runner
        env:
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
        run: python cloudflare/vworld/direct-check.py
      - name: Compare HTTP protocols and bounded retries
        env:
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
        run: python cloudflare/vworld/protocol-check.py
      - name: Check vector provider responses
        run: |
          python - <<'PY'
          import pathlib,urllib.request,urllib.error,json
          base=pathlib.Path('proxy-url.txt').read_text().strip()
          headers={'Origin':'https://yohyeseong.github.io','User-Agent':'Mozilla/5.0'}
          with urllib.request.urlopen(urllib.request.Request(base+'/health',headers=headers),timeout=20) as r:
              assert json.load(r).get('ready'),'VWorld key not configured'
          report={'proxy':base,'results':[]}
          for path in ['/vector/style/traffic','/vector/style/poi','/vector/traffic/11/1746/793.pbf','/vector/poi/11/1746/793.pbf']:
              try:
                  with urllib.request.urlopen(urllib.request.Request(base+path,headers=headers),timeout=30) as r:
                      raw=r.read(12000001);item={'path':path,'http':r.status,'bytes':len(raw),'vector':path.endswith('.pbf') and raw[:1]==bytes([26])}
                      if '/style/' in path:item['jsonFields']=list(json.loads(raw))[:20]
              except urllib.error.HTTPError as e:
                  item={'path':path,'http':e.code,'message':e.read(300).decode(errors='replace')}
              except Exception as e:item={'path':path,'errorType':type(e).__name__}
              report['results'].append(item)
          pathlib.Path('vworld-vector-check.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vworld-vector-check
          path: |
            proxy-url.txt
            vworld-vector-check.json
            vworld-direct-results/
      - name: Remove temporary secret
        if: always()
        run: rm -f -- "$RUNNER_TEMP/vworld-worker-secrets.json"
