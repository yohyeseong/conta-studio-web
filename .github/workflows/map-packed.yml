name: Prepare compact map display bundles
on:
  push:
    branches: [main]
    paths: ['.github/workflows/map-packed.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prepared-korea-data
  cancel-in-progress: false
jobs:
  packed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install shapely==2.1.2
      - uses: actions/checkout@v4
        with:
          ref: korea-data
          path: source-data
          sparse-checkout: map-grid/20261002
      - name: Build compact display data from verified source
        run: python tools/bundle-map.py source-data/map-grid/20261002 /tmp/map-packed 2
      - name: Verify and publish complete bundle edition
        working-directory: source-data
        run: |
          git config user.name 'Conta Studio deployment'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git sparse-checkout set map-packed/20261002
          mkdir -p map-packed/20261002
          cp -a /tmp/map-packed/. map-packed/20261002/
          git config pack.window 0
          git config pack.threads 2
          git config core.compression 1
          python - <<'PY'
          import pathlib,json,struct,gzip,subprocess
          root=pathlib.Path('map-packed/20261002');manifest=root/'index.json';index=json.loads(manifest.read_text());assert index['complete'] and index['safeOnly'] and index['parents']==107958
          for lod in ('low','detail'):
              count=0
              for p in (root/lod).glob('*.bin'):
                  data=p.read_bytes();magic,token,x,y,flags,*offsets=struct.unpack_from('<4sIHHI17I',data);assert magic==b'CMB2' and token==0x895aa1a4 and flags==1 and offsets[0]==84 and offsets[-1]==len(data) and offsets==sorted(offsets)
                  for i in range(16):
                      if offsets[i]==offsets[i+1]:continue
                      chunk=gzip.decompress(data[offsets[i]:offsets[i+1]]);assert chunk[:4]==b'CMAP' and struct.unpack_from('<I',chunk,4)[0]==token
                      assert struct.unpack_from('<HH',chunk,12)==(x*4+i//4,y*4+i%4)
                  count+=1
              assert count==index['parents']
          files=sorted(p for p in root.rglob('*') if p.is_file() and p!=manifest);batch=[];size=0;number=0
          def publish(paths):
              global number
              number+=1;pathlib.Path('/tmp/bundle-paths').write_bytes(b'\0'.join(str(p).encode() for p in paths)+b'\0')
              subprocess.run(['git','add','--pathspec-from-file=/tmp/bundle-paths','--pathspec-file-nul'],check=True)
              if subprocess.run(['git','diff','--cached','--quiet']).returncode==0:return
              subprocess.run(['git','commit','-m',f'Publish compact map display batch {number}'],check=True)
              subprocess.run(['git','push','origin','HEAD:korea-data'],check=True)
          for p in files:
              length=p.stat().st_size
              if batch and (size+length>100*1024*1024 or len(batch)>=10000):publish(batch);batch=[];size=0
              batch.append(p);size+=length
          if batch:publish(batch)
          publish([manifest])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-packed-report
          path: /tmp/map-packed/index.json
