name: Publish prepared official building data
on:
  push:
    branches: [main]
    paths: ['cloudflare/official/**', '.github/workflows/official-assets.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: official-assets
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore verified published edition
        run: node cloudflare/official/restore_assets.mjs
      - name: Validate every regional artifact
        run: python cloudflare/official/validate_assets.py
      - name: Deploy static official data
        working-directory: cloudflare/official
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
      - name: Verify public edition and range downloads
        run: node cloudflare/official/verify_public.mjs
