name: Publish Windows ZIP
on:
  push:
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare distribution release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v1.1.0-rc.22 || gh release create v1.1.0-rc.22 --target main --title "Conta Studio 1.1.0 RC22" --notes "Windows installer ZIP. Extract the ZIP and run Setup.exe." --prerelease
