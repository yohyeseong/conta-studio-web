name: Publish Windows ZIP
on:
  push:
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare distribution release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v1.1.0-rc.23 || gh release create v1.1.0-rc.23 --target main --title "Conta Studio 1.1.0 RC23 - Full Korea OSM" --notes "Windows installer with nationwide South Korea OSM data (2026-09-18). Extract ZIP and run Setup.exe. Address search and uncached elevation require internet. Data: OpenStreetMap contributors, ODbL 1.0." --prerelease
