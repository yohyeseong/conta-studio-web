name: Publish Conta Studio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare verified browser libraries
        run: |
          python - <<'PY'
          import pathlib,urllib.request,hashlib,concurrent.futures
          files={"rhino3dm.js":"ae12fa5d635b4fb6f66d7328a9bde1dfac26f8d021dcf2335e809b69d136fce4","rhino3dm.wasm":"c831ea5e235603437f6f8f260b0083eebca186a75f8be03efbfc2bb06aa37e21","earcut.min.js":"c23d3b2dc59c5b62994c0053eb66333da211a0efec0f0fdfdf20cf167983f5b5","leaflet.css":"a7837102824184820dfa198d1ebcd109ff6d0ff9a2672a074b9a1b4d147d04c6","leaflet.js":"3104b526504d0d61fd3099a4521e87f732ccc3174dec54e08de6ba8bde3e15ff","OrbitControls.js":"00021f896fee7accad035ada2b72abd9e12f21de349896576e8fd75d9542989e","osmtogeojson.js":"663bb5bbae47d5d12bff9cf1c87b8f973e85fab4b1f83453810aae99add54592","polygon-clipping.js":"9bba412b7e3c286aae2db2808cf9169c974034245643d28eac9270cea489c6ca","three.module.js":"589f8422cd2aa47b9133e47744a2112e34952090dfa9384b707481e34b840694","images/layers-2x.png":"066daca850d8ffbef007af00b06eac0015728dee279c51f3cb6c716df7c42edf","images/layers.png":"1dbbe9d028e292f36fcba8f8b3a28d5e8932754fc2215b9ac69e4cdecf5107c6","images/marker-icon-2x.png":"00179c4c1ee830d3a108412ae0d294f55776cfeb085c60129a39aa6fc4ae2528","images/marker-icon.png":"574c3a5cca85f4114085b6841596d62f00d7c892c7b03f28cbfa301deb1dc437","images/marker-shadow.png":"264f5c640339f042dd729062cfc04c17f8ea0f29882b538e3848ed8f10edb4da","licenses/earcut.txt":"c6eac93c3f14fc55fc797b7c39cdf0f38993faa66da94a4d118f674ad913a9f7","licenses/leaflet.txt":"53e8dc25862014e4324741ca18fbe3611e11d42ef69f59f86ea8c5389647d4cb","licenses/osmtogeojson.txt":"f3418672bee2c39fac846a0aa6db37feb9bc73edb19dc8a2ee6cf9d95b561087","licenses/polygon-clipping.txt":"34024bd84536ca5709868267e106b4f2b4ec074f69ffdd05e61ad954439150ed","licenses/three.txt":"f57eb9202058667d12aebd854fe8a86d6feaeab51078180df5615bfdbd5cff05"}
          sources={"rhino3dm.js":["rhino3dm@8.17.0/rhino3dm.js"],"rhino3dm.wasm":["rhino3dm@8.17.0/rhino3dm.wasm"],"earcut.min.js":["earcut@2.2.4/dist/earcut.min.js","earcut@3.0.2/dist/earcut.min.js"],"leaflet.css":["leaflet@1.9.4/dist/leaflet.css"],"leaflet.js":["leaflet@1.9.4/dist/leaflet.js"],"OrbitControls.js":["three@0.169.0/examples/jsm/controls/OrbitControls.js"],"osmtogeojson.js":["osmtogeojson@3.0.0-beta.5/osmtogeojson.js"],"polygon-clipping.js":["polygon-clipping@0.15.7/dist/polygon-clipping.umd.min.js"],"three.module.js":["three@0.169.0/build/three.module.js"],"images/layers-2x.png":["leaflet@1.9.4/dist/images/layers-2x.png"],"images/layers.png":["leaflet@1.9.4/dist/images/layers.png"],"images/marker-icon-2x.png":["leaflet@1.9.4/dist/images/marker-icon-2x.png"],"images/marker-icon.png":["leaflet@1.9.4/dist/images/marker-icon.png"],"images/marker-shadow.png":["leaflet@1.9.4/dist/images/marker-shadow.png"],"licenses/earcut.txt":["earcut@2.2.4/LICENSE","earcut@2.2.4/LICENSE.md"],"licenses/leaflet.txt":["leaflet@1.9.4/LICENSE","leaflet@1.9.4/LICENSE.md"],"licenses/osmtogeojson.txt":["osmtogeojson@3.0.0-beta.5/LICENSE","osmtogeojson@3.0.0-beta.5/LICENSE.md"],"licenses/polygon-clipping.txt":["polygon-clipping@0.15.7/LICENSE","polygon-clipping@0.15.7/LICENSE.md"],"licenses/three.txt":["three@0.169.0/LICENSE","three@0.169.0/LICENSE.md"]}
          root=pathlib.Path('docs/model/vendor')
          def download(item):
              name,digest=item
              for source in sources[name]:
                  try:
                      data=urllib.request.urlopen('https://cdn.jsdelivr.net/npm/'+source,timeout=60).read()
                      variants=[data,data.rstrip(b'\r\n'),data.rstrip(b'\r\n')+b'\n',data.replace(b'\r\n',b'\n'),data.replace(b'\r\n',b'\n').replace(b'\n',b'\r\n')]
                      matches=[v for v in variants if hashlib.sha256(v).hexdigest()==digest]
                      if not matches:continue
                      data=matches[0]
                      path=root/name;path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(data);return
                  except Exception:continue
              raise RuntimeError('Library verification failed: '+name)
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:list(pool.map(download,files.items()))
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
