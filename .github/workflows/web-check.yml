name: Verify web terrain generation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/web-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install browser check
        run: |
          npm install playwright@1.58.2 rhino3dm@8.17.0
          npx playwright install chromium
      - name: Generate and export model
        run: |
          cat > check.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
            const page=await browser.newPage({viewport:{width:1600,height:1000}});
            let started=Date.now();let firstMapImageMs=null;page.on('response',r=>{if(r.url().includes('/map-preview/')&&r.status()===200&&firstMapImageMs===null)firstMapImageMs=Date.now()-started;});
            let preparedRequests=0,legacyRequests=0;page.context().on('request',r=>{if(r.url().includes('/korea-data/prepared/'))preparedRequests++;if(/\/korea-data\/(tiles|catalog)\//.test(r.url()))legacyRequests++;});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto('https://yohyeseong.github.io/conta-studio-web/model/?check=fix8',{waitUntil:'networkidle',timeout:120000});
            for(let retry=0;retry<15;retry++){if(await page.evaluate(()=>document.querySelector('script[type="module"]').src.includes('fix8')))break;await page.waitForTimeout(5000);started=Date.now();firstMapImageMs=null;await page.goto('https://yohyeseong.github.io/conta-studio-web/model/?check=fix8-'+retry,{waitUntil:'networkidle'});}
            await page.waitForFunction(()=>document.querySelector('#viewport canvas'),null,{timeout:30000});
            await page.waitForFunction(()=>document.querySelector('.map-note')?.textContent.includes('전국 한국 OSM'),null,{timeout:120000});
            const fullMapMs=Date.now()-started;if(firstMapImageMs===null)throw Error('Startup map preview missing');
            await page.setViewportSize({width:1920,height:1080});await page.waitForTimeout(500);
            const aligned=await page.locator('.overlap-toggle').evaluate(el=>{const a=el.querySelector('input').getBoundingClientRect(),b=el.querySelector('span').getBoundingClientRect();return a.right<b.left&&Math.abs(a.top-b.top)<5;});if(!aligned)throw Error('Checkbox layout incorrect');
            const map=await page.locator('#map').boundingBox();
            for(let i=0;i<3;i++){await page.locator('.leaflet-control-zoom-in').click();await page.waitForTimeout(350);}
            await page.mouse.move(map.x+map.width/2-12,map.y+map.height/2-12);
            await page.mouse.down({button:'right'});
            await page.mouse.move(map.x+map.width/2+12,map.y+map.height/2+12,{steps:10});
            await page.mouse.up({button:'right'});
            if(await page.locator('#generate').isDisabled())throw Error('Zoomed small selection rejected');
            await page.locator('#generate').click();
            await page.waitForFunction(()=>!document.querySelector('#save').disabled,null,{timeout:240000});
            await page.locator('#cut-ground').uncheck();
            await page.waitForFunction(()=>!document.querySelector('#save').disabled,null,{timeout:240000});
            await page.locator('#cut-ground').check();
            await page.waitForFunction(()=>!document.querySelector('#save').disabled,null,{timeout:240000});
            const downloadPromise=page.waitForEvent('download');
            await page.locator('#save').click();
            const download=await downloadPromise;await download.saveAs('web-model.3dm');
            const bytes=fs.readFileSync('web-model.3dm');const rhino=await require('rhino3dm')();const file=rhino.File3dm.fromByteArray(new Uint8Array(bytes));if(!file||file.objects().count<1||file.layers().count<1||file.settings().modelUnitSystem.value!==2)throw Error('Invalid Rhino export');const rhinoObjects=file.objects().count,rhinoLayers=file.layers().count;file.delete();
            if(errors.length)throw Error(errors.join('\n'));
            const cached=await page.evaluate(async()=>{const cache=await caches.open('conta-korea-4e05284bc04d8ff5');return (await cache.keys()).length;});
            if(cached<3)throw Error('Regional persistent cache missing');
            const cachedPreparedFiles=await page.evaluate(async()=>{const cache=await caches.open('conta-korea-4e05284bc04d8ff5');const keys=await cache.keys();return keys.filter(r=>r.url.includes('/prepared/v2/')).length;});if(cachedPreparedFiles<3||legacyRequests!==0)throw Error('Preprocessed data path not used');
            const result={preparedRequests,legacyRequests,cachedPreparedFiles,zoomedSmallRegion:await page.locator('#area').innerText(),overlapOptionApplied:true,firstMapImageMs,fullMapMs,cachedRegionalFiles:cached,status:await page.locator('#status').innerText(),info:await page.locator('#model-info').innerText(),exportBytes:bytes.length,rhinoObjects,rhinoLayers};
            await page.context().route('**/korea-data/prepared/**',route=>route.abort());
            await page.context().route('**/terrarium/**',route=>route.abort());
            await page.reload({waitUntil:'networkidle'});
            await page.waitForFunction(()=>document.querySelector('.map-note')?.textContent.includes('전국 한국 OSM'),null,{timeout:30000});
            for(let i=0;i<3;i++){await page.locator('.leaflet-control-zoom-in').click();await page.waitForTimeout(150);}
            const warmMap=await page.locator('#map').boundingBox();
            await page.mouse.move(warmMap.x+warmMap.width/2-12,warmMap.y+warmMap.height/2-12);await page.mouse.down({button:'right'});
            await page.mouse.move(warmMap.x+warmMap.width/2+12,warmMap.y+warmMap.height/2+12,{steps:5});await page.mouse.up({button:'right'});
            await page.locator('#generate').click();await page.waitForFunction(()=>!document.querySelector('#save').disabled,null,{timeout:60000});
            result.warmModelWithoutDataNetwork=true;
            fs.writeFileSync('web-validation.json',JSON.stringify(result,null,2));
            await page.screenshot({path:'web-model.png',fullPage:true});
            console.log(JSON.stringify(result));await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-model-validation
          path: |
            web-validation.json
            web-model.png
            web-model.3dm
